
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4b Question 3</title>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>

</head>
<body>

    <h1>Lab 4b - Question 3</h1>
    <h2>JavaScript and jQuery</h2>

    <div id="myElement">Original Text</div>

    <br>

    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <br>

    <button id="myButton">Click me</button>

    <!-- Include jQuery 4.0.0 -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script>
        $(document).ready(function() {

            // (a) Change the text
            $("#myElement").text("Modified Text");

            // (b) Add the CSS class
            $("#myDIV").addClass("myStyle");

            // (c) Button click event
            $("#myButton").on("click", function() {
                alert("Button clicked!");
            });

        });
    </script>

</body>
</html>
